<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc">
  <title id="title">핀봄 LangGraph Agent의 세로형 상담 흐름</title>
  <desc id="desc">사용자 질문을 분석하고 준비된 질문은 법령 또는 금융상품 도구를 조회해 답변하며, 조건이 부족하거나 지원 범위 밖인 질문은 별도 안내로 종료하는 흐름</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFE"/>
      <stop offset="1" stop-color="#EFF5FA"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183A5A"/>
      <stop offset="1" stop-color="#255D88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16324A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F7392"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B88034"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1.7px; fill: #52718D; }
      .heading { font-size: 30px; font-weight: 760; fill: #102A43; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #5C7185; }
      .step { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; fill: #5D7E9B; }
      .node-title { font-size: 21px; font-weight: 760; fill: #102A43; }
      .node-copy { font-size: 14px; font-weight: 520; fill: #5A6E82; }
      .code { font-size: 12px; font-weight: 700; letter-spacing: .4px; fill: #2C5D83; }
      .branch-title { font-size: 17px; font-weight: 750; fill: #18344D; }
      .branch-copy { font-size: 13px; font-weight: 520; fill: #627588; }
      .small { font-size: 12px; font-weight: 600; fill: #6A7F92; }
    </style>
  </defs>

  <rect width="900" height="1280" rx="32" fill="url(#canvas)"/>
  <path d="M88 72 H812" stroke="#D9E5EE" stroke-width="1"/>
  <text x="88" y="108" class="eyebrow">FINBOM · LANGGRAPH AGENT</text>
  <text x="88" y="151" class="heading">질문에서 근거 있는 답변까지</text>
  <text x="88" y="181" class="subtitle">주 흐름은 세로로, 상담을 멈추는 두 분기만 좌우로 읽습니다.</text>

  <path d="M450 278 V314" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 432 V470" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 570 V622" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 738 V780" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 946 V984" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="180" y="214" width="540" height="64" rx="20" fill="#FFFFFF" stroke="#D6E3ED"/></g>
  <circle cx="220" cy="246" r="18" fill="#E4F0F8"/>
  <path d="M213 244h14M213 250h9" stroke="#255D88" stroke-width="2" stroke-linecap="round"/>
  <text x="254" y="241" class="step">INPUT</text>
  <text x="254" y="262" class="node-title" style="font-size:18px">사용자 질문과 이전 상담 상태</text>

  <g filter="url(#shadow)"><rect x="180" y="314" width="540" height="118" rx="22" fill="#FFFFFF" stroke="#C9DAE7"/></g>
  <rect x="202" y="337" width="96" height="24" rx="12" fill="#E8F2F9"/>
  <text x="214" y="354" class="code">analyze_turn</text>
  <text x="202" y="390" class="node-title">질문과 상품 조건 분석</text>
  <text x="202" y="415" class="node-copy">의도와 이전 턴의 예·적금 조건을 합쳐 다음 경로를 정합니다.</text>

  <g filter="url(#shadow)"><rect x="270" y="470" width="360" height="100" rx="24" fill="url(#primary)"/></g>
  <text x="450" y="501" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#BFD9ED">ROUTE</text>
  <text x="450" y="532" text-anchor="middle" style="font-size:21px;font-weight:760;fill:#FFFFFF">답변 · 조건 보완 · 범위 안내</text>
  <text x="450" y="555" text-anchor="middle" style="font-size:13px;font-weight:560;fill:#D6E8F5">한 번의 판단으로 세 경로 중 하나를 선택</text>

  <path d="M270 520 H157 V603" fill="none" stroke="#B88034" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M630 520 H743 V603" fill="none" stroke="#7B8FA1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="174" y="508" width="65" height="24" rx="12" fill="#FFF1D9"/>
  <text x="206.5" y="525" text-anchor="middle" style="font-size:11px;font-weight:750;fill:#946523">clarify</text>
  <rect x="664" y="508" width="102" height="24" rx="12" fill="#E8EEF3"/>
  <text x="715" y="525" text-anchor="middle" style="font-size:11px;font-weight:750;fill:#5F7487">out_of_scope</text>
  <rect x="415" y="584" width="70" height="24" rx="12" fill="#DDECF7"/>
  <text x="450" y="601" text-anchor="middle" style="font-size:11px;font-weight:750;fill:#255D88">ready</text>

  <g filter="url(#shadow)"><rect x="50" y="606" width="214" height="132" rx="20" fill="#FFFAF1" stroke="#E8CCA0"/></g>
  <circle cx="79" cy="637" r="14" fill="#F4D9AC"/>
  <text x="79" y="642" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#85591D">?</text>
  <text x="101" y="643" class="branch-title">조건 한 가지 질문</text>
  <text x="70" y="676" class="branch-copy">상품 종류 또는 가입 기간이</text>
  <text x="70" y="698" class="branch-copy">부족하면 확인 후 이번 턴 종료</text>
  <text x="70" y="721" class="code" style="fill:#946523">ask_clarifying_question</text>

  <g filter="url(#shadow)"><rect x="300" y="622" width="300" height="116" rx="22" fill="#FFFFFF" stroke="#9FC2DC" stroke-width="1.5"/></g>
  <text x="324" y="651" class="step">AGENT MODEL</text>
  <text x="324" y="684" class="node-title">필요한 근거 도구 선택</text>
  <text x="324" y="709" class="node-copy">Tool 호출이 없으면 바로 답변</text>
  <text x="324" y="729" class="code">agent_model</text>

  <g filter="url(#shadow)"><rect x="636" y="606" width="214" height="132" rx="20" fill="#F7F9FB" stroke="#CFDCE5"/></g>
  <circle cx="665" cy="637" r="14" fill="#DEE7EE"/>
  <path d="M659 637h12" stroke="#61788C" stroke-width="2" stroke-linecap="round"/>
  <text x="687" y="643" class="branch-title">지원 범위 안내</text>
  <text x="656" y="676" class="branch-copy">현재 답할 수 있는 상담 범위와</text>
  <text x="656" y="698" class="branch-copy">예시 질문을 안내하고 종료</text>
  <text x="656" y="721" class="code" style="fill:#61788C">explain_scope</text>

  <g filter="url(#shadow)"><rect x="120" y="780" width="660" height="166" rx="24" fill="#FFFFFF" stroke="#C8DCEB"/></g>
  <text x="146" y="811" class="step">EVIDENCE TOOLS</text>
  <rect x="146" y="830" width="236" height="82" rx="16" fill="#F1F7FB" stroke="#D3E3EE"/>
  <circle cx="174" cy="858" r="13" fill="#CEE5F4"/>
  <path d="M169 853h10v11h-10zM171 850h6" fill="none" stroke="#255D88" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="197" y="857" class="branch-title">금융 법령 검색</text>
  <text x="197" y="881" class="code">search_law_articles</text>
  <rect x="398" y="830" width="356" height="82" rx="16" fill="#F1F7FB" stroke="#D3E3EE"/>
  <circle cx="426" cy="858" r="13" fill="#CEE5F4"/>
  <path d="M420 864v-9l6-4 6 4v9M418 864h16" fill="none" stroke="#255D88" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="449" y="857" class="branch-title">Finlife 예·적금 조회</text>
  <text x="449" y="881" class="code">search_financial_products</text>
  <text x="146" y="932" class="small">동일 Tool 호출 반복과 한 질문의 4회 초과 호출은 중단</text>

  <g filter="url(#shadow)"><rect x="230" y="984" width="440" height="96" rx="22" fill="#FFFFFF" stroke="#9FC2DC" stroke-width="1.5"/></g>
  <rect x="254" y="1006" width="126" height="23" rx="11.5" fill="#E5F0F8"/>
  <text x="317" y="1022" text-anchor="middle" class="code">agent_model 재진입</text>
  <text x="254" y="1057" class="node-title">조회 결과를 읽고 답변 구성</text>
  <path d="M450 1080 V1112" stroke="#4F7392" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="180" y="1114" width="540" height="72" rx="22" fill="url(#primary)"/></g>
  <circle cx="220" cy="1150" r="17" fill="#6FA7CE"/>
  <path d="M213 1146h14M213 1152h9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="254" y="1146" style="font-size:12px;font-weight:800;letter-spacing:1.2px;fill:#BFD9ED">OUTPUT</text>
  <text x="254" y="1170" style="font-size:19px;font-weight:750;fill:#FFFFFF">답변 · 사용한 법령 · 비교 상품</text>

  <rect x="88" y="1213" width="724" height="40" rx="14" fill="#E3EDF4"/>
  <circle cx="111" cy="1233" r="7" fill="#5F89A9"/>
  <text x="130" y="1238" class="small" style="fill:#46677F">SQLite Checkpointer · thread_id별 메시지와 확인된 상품 조건 유지</text>
</svg>
