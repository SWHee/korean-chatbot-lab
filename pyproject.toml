[project]
name = "korean-chatbot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.7",
    "langchain-text-splitters>=1.1.2",
    "langfeather[langchain]",
    "langgraph>=1.2.9",
    "langsmith>=0.9.7",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chatbot"

[tool.uv.sources]
langfeather = { git = "https://github.com/SungjinWi99/langfeather.git", subdirectory = "sdk/python", rev = "a410f7c4211bbcabb9c9e5717bc23988797f9605" }

[tool.fastapi]
entrypoint = "chatbot.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
