[project]
name = "korean-chatbot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.120.2",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.1.0",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1,<2.13",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
evaluation = [
    "langchain-google-genai>=4.2.7",
    "langsmith>=0.9.7",
]
tracing = [
    "langfeather[langchain]==0.2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chatbot"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.fastapi]
entrypoint = "chatbot.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
