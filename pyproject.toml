[project]
name = "korean-chatbot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chatbot"

[tool.fastapi]
entrypoint = "chatbot.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
