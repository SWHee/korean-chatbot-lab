services:
  web:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/korean-chatbot-web:latest
    ports:
      - "3000:3000"
    environment:
      CHATBOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
    image: ${DOCKERHUB_USERNAME:-local}/korean-chatbot-api:latest
    environment:
      CHATBOT_BACKEND: ollama
      CHATBOT_INDEX_DIR: /app/data/index/chroma
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT_SECONDS: "300"
      LANGFEATHER_ENABLED: "false"
      LANGSMITH_TRACING: "false"
    volumes:
      - ./data/index:/app/data/index
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; from chatbot.vectorstore import open_collection; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json'); open_collection()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  huggingface_cache:
  ollama_data:
