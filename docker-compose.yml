services:
  web:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/korean-chatbot-web:${IMAGE_TAG:-latest}
    ports:
      - "3000:3001"
    environment:
      CHATBOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
    image: ${DOCKERHUB_USERNAME:-local}/korean-chatbot-api:${IMAGE_TAG:-latest}
    environment:
      CHATBOT_BACKEND: anthropic
      CHATBOT_INDEX_DIR: /app/data/index/chroma
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-60}
      FINLIFE_API_KEY: ${FINLIFE_API_KEY:?Set FINLIFE_API_KEY in .env}
      LANGFEATHER_ENABLED: "false"
      LANGSMITH_TRACING: "false"
    volumes:
      - ./data/index:/app/data/index
      - huggingface_cache:/root/.cache/huggingface
      - agent_runtime:/app/.runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; from chatbot.vectorstore import open_collection; [os.environ[name] for name in ('ANTHROPIC_API_KEY', 'FINLIFE_API_KEY')]; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json'); open_collection(); assert os.access('/app/.runtime', os.W_OK)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  huggingface_cache:
  agent_runtime:
